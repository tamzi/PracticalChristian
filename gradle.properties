# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM to use for Gradle daemon (Java 21 required for buildLogic convention plugins)
# Note: Gradle will use JAVA_HOME environment variable if org.gradle.java.home is not set
# org.gradle.java.home=/Users/franktamre/Library/Java/JavaVirtualMachines/corretto-21.0.9/Contents/Home
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Suppress deprecation warnings for android.newDsl until Hilt plugin supports it
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Non-deprecated settings that we're intentionally keeping non-default
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# AGP 9.0 Compatibility Settings
# REQUIRED: android.newDsl=false until Hilt plugin supports new DSL (as of Hilt 2.58)
# This setting is deprecated in AGP 9.0 and will be removed in AGP 10.0
# Current blocker: Hilt plugin throws "Could not find the Android Gradle Plugin (AGP) base extension" with newDsl=true
# Action needed before AGP 10.0: Monitor Hilt releases for new DSL support
# Related: https://github.com/google/dagger/issues/4944
android.newDsl=false

# Experimental setting - using non-default value intentionally
# This allows Kotlin source sets in Android projects (non-standard structure)
# Warning is expected as this is an experimental feature
android.disallowKotlinSourceSets=false

# Suppress performance warning - we're using dependency constraints intentionally
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
